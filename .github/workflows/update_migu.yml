name: update咪咕

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0-23/2 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
     
      - name: 安装Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'
     
      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'
     
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          # 检查安装
          python -c "from Crypto.Cipher import AES; print('pycryptodome安装成功')"
     
      - name: 执行更新脚本
        run: |
          python MIGU.py
     
      - name: 如果有更改则提交
        run: |
          # 检查需要提交的文件
          changes=()
          for file in migu.txt; do
            if [[ -f "$file" ]] && ! git diff --quiet -- "$file"; then
              changes+=("$file")
            fi
          done
          
          if [ ${#changes[@]} -eq 0 ]; then
            echo "没有文件更改"
            exit 0
          fi
          
          # 配置Git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 添加更改的文件并提交
          git add "${changes[@]}"
          git commit -m "自动更新：$(date '+%Y-%m-%d %H:%M:%S')"
          git push
